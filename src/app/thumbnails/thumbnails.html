<h4>
  Click to see some of my work below:
</h4>

<nav>
  @if (galleryNames.length > 0) {
  <div class="gallery-thumbs">
    @for (name of galleryNames; track name) {
    <a routerLink="/gallery/{{name}}">
      <div class="labeled-image">
        <img src="images/{{name}}/{{name}}0-gallery-thumb.JPG" alt="{{formatName(name)}}"/>
       <div class="label center">{{formatName(name)}}</div>
      </div>
    </a>
    }
  </div>
  }

</nav>
